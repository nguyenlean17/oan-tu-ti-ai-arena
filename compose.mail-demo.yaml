services:
  app:
    environment:
      REQUIRE_EMAIL_VERIFICATION: "1"
      MAILPIT_URL: http://mailpit:8025
    networks: [mail]
  mailpit:
    image: axllent/mailpit:v1.30
    ports: ["127.0.0.1:8025:8025"]
    networks: [mail, mail-ui]
    mem_limit: 128m
    cpus: 0.5
networks:
  mail-ui: {}
  mail:
    internal: true
