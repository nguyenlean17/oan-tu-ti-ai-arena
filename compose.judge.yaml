name: uet-arena-cloud-judge
services:
  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
    image: oan-tu-ti-judge:cloud
    init: true
    environment:
      CONTROL_URL: "${CONTROL_URL:?Set CONTROL_URL to your HTTPS Vercel site}"
      JUDGE_TOKEN_FILE: /run/secrets/judge-token
      IDLE_POLL_MS: "${IDLE_POLL_MS:-5000}"
    volumes:
      - ./.secrets/vercel-judge-token:/run/secrets/judge-token:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
