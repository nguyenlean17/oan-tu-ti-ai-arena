name: oan-tu-ti-arena
services:
  app:
    build: .
    image: oan-tu-ti-arena:local
    init: true
    ports:
      - "127.0.0.1:${ARENA_PORT:-3000}:3000"
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:3000}"
      DATA_DIR: /data
      SITES_RUNTIME_ROOT: /data/runtime
      JUDGE_TOKEN_FILE: /run/secrets/judge-token
    volumes:
      - arena-data:/data
      - ./.secrets/judge-token:/run/secrets/judge-token:ro
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 3
  judge:
    build:
      context: .
      dockerfile: judge/Dockerfile
    image: oan-tu-ti-judge:local
    init: true
    environment:
      CONTROL_URL: http://app:3000
      JUDGE_TOKEN_FILE: /run/secrets/judge-token
    volumes:
      - ./.secrets/judge-token:/run/secrets/judge-token:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
volumes:
  arena-data:
    name: "${ARENA_DATA_VOLUME:-oan-tu-ti-arena_arena-data}"
